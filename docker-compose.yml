# SPA rebuild W6 (single-process cutover): this compose file only runs the
# FastAPI/uvicorn API container -- there is no `frontend` service anymore.
# For local dev with the React SPA, run two terminals OUTSIDE Docker
# instead (hot reload for both sides, which a container rebuild loop can't
# give you):
#
#   uvicorn app.main:app --reload --port 8000      # terminal 1: API
#   cd web && npm run dev                            # terminal 2: Vite dev server
#
# Vite's dev server (default http://localhost:5173) proxies the backend API
# prefixes to :8000 (see web/vite.config.ts's API_PROXY_PREFIXES) -- open
# the Vite URL, not :8000, while developing. `docker compose up --build`
# below is for exercising the built image's single-process API only (e.g.
# smoke-testing the production topology); it does not include the SPA dev
# loop.
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  # ROADMAP.md Step 5.2: pgvector-backed Postgres for local verification of
  # the pgvector VectorStore backend (app.rag.pgvector_store) and the
  # Alembic migration that creates its table -- NOT wired into the `api`
  # service by default (`api` still defaults to VECTOR_BACKEND=chroma /
  # sqlite; see .env.example). Bring it up on its own to test the pgvector
  # path: `docker compose up pgvector`, then point DATABASE_URL at
  # localhost:5433 and set VECTOR_BACKEND=pgvector.
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: macrochef
      POSTGRES_PASSWORD: macrochef
      POSTGRES_DB: macrochef
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
