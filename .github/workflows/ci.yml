name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: >-
          Deploy to Azure Container Apps after tests pass. Only takes effect
          on the default branch — this is the manual "pull the trigger" step
          for production promotion (see docs/DEPLOY.md).
        type: boolean
        default: true
      alembic_action:
        description: >-
          One-off production-database maintenance (ROADMAP 5.1
          brownfield-adoption gap): prod's schema predates Alembic (it was
          created by the old app.data.db.init_db()'s create_all(), never
          via a migration), so `alembic upgrade head` in the deploy job
          below fails trying to re-create tables that already exist.
          'none' (default) does nothing -- every ordinary run leaves this
          alone. 'inspect' READS prod's current table list only (zero
          writes) so you can confirm it matches what
          alembic/versions/0001_baseline_schema.py expects before doing
          anything else. An 'inspect' run on 2026-07-30 found prod is
          ALSO missing two of the six 0001 tables (llm_calls,
          llm_cache_entries -- both added after prod's last successful
          deploy, per ROADMAP 1.2/2.3): 'backfill_llm_tables' creates
          exactly those two tables via
          `Base.metadata.tables[...].create(engine, checkfirst=True)`
          (schema taken from the live app.data.models ORM, so it's
          guaranteed identical to what 0001 would have created; additive
          only, never drops or alters anything, safe to re-run). Run
          'inspect' first, then 'backfill_llm_tables' if it reports either
          table missing, THEN 'stamp_0001' marks prod's alembic_version as
          already at revision 0001 -- this writes ONE bookkeeping row,
          runs NO schema DDL at all -- so that a future `alembic upgrade
          head` correctly skips 0001 and only applies 0002 onward (the
          genuinely new tables from this session, which do not exist in
          prod yet). Never skip straight to stamping without inspecting
          (and backfilling, if needed) first.
        type: choice
        options:
          - none
          - inspect
          - backfill_llm_tables
          - stamp_0001
        default: none

# Azure resource naming — change here to repoint the whole pipeline.
# ACR_NAME must be globally unique across all of Azure (5-50 alphanumeric
# chars). If `acrmacrochef01` is taken, `az acr create` fails loudly with a
# name-conflict error (not silently) — pick a new suffix and re-run.
env:
  AZURE_REGION: italynorth
  RESOURCE_GROUP: rg-macrochef
  ACA_ENV_NAME: cae-macrochef
  ACA_APP_NAME: ca-macrochef
  ACA_STAGING_APP_NAME: ca-macrochef-staging
  ACR_NAME: acrmacrochef01

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show installed versions
        run: pip show langgraph chromadb sentence-transformers | grep -E "^(Name|Version)"

      - name: Run tests
        env:
          EMBEDDING_PROVIDER: hash
        run: pytest -v --tb=short

      - name: Diet-leak safety gate
        run: python scripts/audit_diet_leaks.py

      - name: Safety benchmark gate (deterministic/mock subset)
        # ROADMAP.md Phase 3, Step 3.4. Hard CI gate: fails the build if the
        # ADJUDICATED-true `inherent` (release-blocking) violation count is
        # nonzero -- see scripts/run_all_evals.py's `release_gate_pass`
        # (`adjudicated_count == 0`) and CLAUDE.md's release-gate semantics.
        #
        # Deliberately `scripts/run_all_evals.py`, NOT
        # `scripts/run_safety_benchmark.py` directly: that script's own exit
        # code is `1 if report.inherent.worst_successes > 0` -- the RAW
        # judge-flagged count, which is expected to be occasionally nonzero
        # even on a genuinely clean corpus (the judge is a deliberately
        # recall-biased substring matcher with known false positives, e.g.
        # on substitution_attack/derivative_name cases -- confirmed
        # empirically while building this gate: see this task's report).
        # Gating CI on that raw exit code would make every PR fail
        # permanently, regardless of any real regression. `run_all_evals.py`
        # additionally runs the exhaustive mechanical adjudicator
        # (scripts/verify_benchmark_evidence.py, real
        # contains_allergen/violates_diet_type calls) against every flagged
        # case before deciding pass/fail -- the correct, both-numbers-aware
        # release-gate condition.
        #
        # MONEY GATE: this step can NEVER spend money. `run_all_evals.py`
        # exposes no `--provider`/real-provider flag at all (see that
        # script's module docstring), and force-sets MODEL_PROVIDER=mock +
        # strips every provider API key from the environment before any
        # `app.*` import, regardless of ambient secrets.
        #
        # `--safety-runs 1`, not the official k=3: the mock/deterministic
        # provider has no response variance (confirmed empirically -- see
        # this step's own task report), so k=3 here would triple the
        # wall-clock for identical numbers. The k=3 any-run-worst-case
        # methodology stays the OFFICIAL release-gate artifact, produced by
        # a human running `scripts/run_safety_benchmark.py`'s own default
        # (`--runs 3`) directly. Retrieval/constraint suites are skipped
        # here to keep this step scoped to the safety gate only and fast
        # (data/chroma isn't baked in this job -- retrieval would just
        # report "skipped" anyway, see run_all_evals.py's own handling).
        env:
          EMBEDDING_PROVIDER: hash
        run: >-
          python scripts/run_all_evals.py --safety-runs 1
          --skip-retrieval --skip-constraints
          --report-path /tmp/ci_eval_report.json

  # SPA rebuild W6: web/ has its own toolchain (Node/npm), so it gets its
  # own job rather than being folded into `test` above — runs on every
  # push/PR too, same as `test`. `preflight` (below) gates on BOTH this job
  # and `test`, so a broken SPA build/lint/typecheck/test blocks deploy
  # exactly like a broken pytest run does.
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test -- --run

      - name: Build
        working-directory: web
        run: npm run build

  # ROADMAP.md Phase 5, Step 5.2: separate job (not folded into `test`)
  # because it needs a real Postgres+pgvector service container — `test`
  # above stays fast/dependency-free for the default (chroma/sqlite) path.
  # Exercises: the pgvector `VectorStore` contract
  # (tests/test_vector_store_contract.py, both backends — Chroma cases run
  # here too, redundantly with `test`, since the file is one module), the
  # 0002/0003 migrations against a REAL Postgres, not just sqlite
  # (tests/test_alembic_migrations.py — the sqlite-only cases run again
  # here too, harmlessly), and the shared Postgres-backed rate limiter
  # (tests/test_rate_limiting.py's Postgres-only cases). Production still
  # defaults to VECTOR_BACKEND=chroma / sqlite DATABASE_URL (see
  # .env.example) — this job doesn't change what ships, it proves the
  # Postgres-backed paths actually work before anyone flips those env vars.
  pgvector-check:
    name: pgvector backend contract + migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: macrochef
          POSTGRES_PASSWORD: macrochef
          POSTGRES_DB: macrochef
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U macrochef"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pgvector contract + real-Postgres migration + shared-rate-limiter tests
        env:
          EMBEDDING_PROVIDER: hash
          TEST_POSTGRES_URL: postgresql://macrochef:macrochef@localhost:5432/macrochef
        run: >-
          pytest tests/test_vector_store_contract.py tests/test_alembic_migrations.py
          tests/test_rate_limiting.py -v --tb=short

  # ---------------------------------------------------------------------
  # One-off maintenance: see `alembic_action`'s own description above for
  # the full "why" (prod predates Alembic; this fixes the resulting
  # `alembic upgrade head` failure in the `deploy` job below). Runs ONLY on
  # an explicit workflow_dispatch with `alembic_action` set to something
  # other than 'none' -- an ordinary push/PR never touches this job, and
  # the default keeps it a no-op even on a manual dispatch that only meant
  # to set `deploy`.
  # ---------------------------------------------------------------------

  alembic-baseline-maintenance:
    name: "One-off: inspect or stamp Alembic baseline (prod)"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.alembic_action != 'none'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect prod's current tables (read-only, zero writes)
        if: inputs.alembic_action == 'inspect'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, inspect

          url = os.environ["DATABASE_URL"]
          if url.startswith("postgres://"):
              # SQLAlchemy 2.x's psycopg2 dialect requires the postgresql://
              # scheme; some providers (Neon included) hand out postgres://.
              url = url.replace("postgres://", "postgresql://", 1)

          engine = create_engine(url)
          insp = inspect(engine)
          tables = sorted(insp.get_table_names())

          print("Tables currently in the production database:")
          for table in tables:
              print(f"  - {table}")

          print()
          print("Expected from alembic/versions/0001_baseline_schema.py "
                "(feedback, session_memory, user_saved_recipes, shared_plans, "
                "llm_calls, llm_cache_entries) -- confirm these ARE present "
                "and that NOTHING from 0002 onward (recipe_embeddings, "
                "rate_limit_hits, graph_runs, chat_threads, chat_messages, "
                "agent_notes) is present yet, before running 'stamp_0001'.")
          engine.dispose()
          PY

      - name: Backfill missing 0001 tables (llm_calls, llm_cache_entries -- additive only)
        if: inputs.alembic_action == 'backfill_llm_tables'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine

          from app.data.db import Base
          import app.data.models  # noqa: F401 -- populates Base.metadata

          url = os.environ["DATABASE_URL"]
          if url.startswith("postgres://"):
              url = url.replace("postgres://", "postgresql://", 1)

          engine = create_engine(url)
          for table_name in ("llm_cache_entries", "llm_calls"):
              table = Base.metadata.tables[table_name]
              table.create(engine, checkfirst=True)
              print(f"Ensured table exists (checkfirst=True, no-op if already present): {table_name}")
          engine.dispose()
          PY

      - name: Stamp alembic_version at 0001 (writes one bookkeeping row, runs NO schema DDL)
        if: inputs.alembic_action == 'stamp_0001'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic stamp 0001

  # ---------------------------------------------------------------------
  # ROADMAP.md Phase 5, Step 5.3: staging auto-deploys on every ordinary
  # push to main (no workflow_dispatch gate) -- deliberately the opposite
  # trigger condition from `preflight`/`build-and-push`/`deploy` below,
  # which stay manual-promote-only. This keeps the existing human-gate
  # philosophy for PRODUCTION (a human still pulls that trigger) while
  # giving every merge a disposable, low-stakes environment to sanity-check
  # against first. Same image build process as prod (same Dockerfile, same
  # commit) -- just its own tag/app/SKU, never the prod image itself.
  # ---------------------------------------------------------------------

  staging-deploy:
    name: Auto-deploy to staging
    needs: [test, web, pgvector-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      staging_url: ${{ steps.url.outputs.staging_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      # Idempotent, mirrors preflight/deploy's own "create if absent"
      # pattern below -- staging reuses the SAME resource group, ACR, and
      # Container Apps environment as prod (no new Azure account/resource
      # class the human needs to provision beyond what AZURE_CREDENTIALS
      # already grants); only the Container App itself is staging-specific.
      - name: Create resource group (if absent)
        run: |
          set -euo pipefail
          az group show --name "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az group create --name "$RESOURCE_GROUP" --location "$AZURE_REGION"

      - name: Create ACR (if absent)
        run: |
          set -euo pipefail
          az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az acr create \
              --name "$ACR_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --sku Basic \
              --admin-enabled false

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build and push staging image
        # Tagged distinctly from prod's `:latest`/`:<sha>` tags (never
        # overwrites or aliases the production image) -- built from the
        # exact same Dockerfile/commit, so "same image" per this step's
        # acceptance criterion means "same build process," not "the literal
        # artifact prod is running" (prod's own build only happens on a
        # manual workflow_dispatch promote, a separate trigger entirely).
        run: |
          set -euo pipefail
          IMAGE="$ACR_NAME.azurecr.io/macrochef-api:staging-${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "STAGING_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Create Container Apps environment (if absent)
        run: |
          set -euo pipefail
          az containerapp env show \
            --name "$ACA_ENV_NAME" --resource-group "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az containerapp env create \
              --name "$ACA_ENV_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$AZURE_REGION"

      - name: Create staging Container App (if absent)
        run: |
          set -euo pipefail
          # Small SKU per this step's acceptance criterion -- half of
          # prod's 1.0 CPU/2.0Gi. Still needs enough headroom for
          # torch+MiniLM+Chroma at import time (see prod's own comment on
          # why 0.5/1Gi crash-looped for THIS app on first deploy) --
          # 0.75/1.5Gi is a deliberate middle ground, not the same 0.5/1Gi
          # that already failed once for the identical image.
          az containerapp show \
            --name "$ACA_STAGING_APP_NAME" --resource-group "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az containerapp create \
              --name "$ACA_STAGING_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV_NAME" \
              --image "$STAGING_IMAGE" \
              --target-port 8000 \
              --ingress external \
              --registry-server "$ACR_NAME.azurecr.io" \
              --registry-identity system \
              --min-replicas 1 \
              --max-replicas 1 \
              --cpu 0.75 --memory 1.5Gi

      - name: Update staging revision — image, secrets, env vars
        run: |
          set -euo pipefail
          # No new secrets/managed-Postgres for staging -- CLAUDE.md's
          # human gate on provisioning hosting/managed-DB accounts applies
          # here, so this deploy asks for nothing new from the human.
          # DATABASE_URL is left UNSET -- app.config.Settings' own default
          # (sqlite:///./macrochef.db) applies, an ephemeral file inside
          # the container's own filesystem, NEVER prod's Postgres; a fresh
          # revision (or a container restart) starts with an empty DB,
          # which is the correct, safe behavior for a disposable staging
          # environment, not a bug to fix here.
          # MODEL_PROVIDER=mock + MODEL_PROVIDER_FALLBACKS unset:
          # deliberately never spends real LLM API money on an
          # unsupervised, auto-triggered deploy -- CLAUDE.md's money gate
          # ("anything with nontrivial spend needs approval with a cost
          # estimate first") extends to what this workflow can trigger
          # with zero human review between a merge and this job running.
          # SESSION_SECRET is reused from the SAME repo secret prod already
          # has -- sessions here are anonymous (no real user accounts, see
          # app.dependencies), so sharing the HMAC signing secret across
          # environments carries no meaningful security cost and needs no
          # new secret from the human.
          az containerapp secret set \
            --name "$ACA_STAGING_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets \
              session-secret="${{ secrets.SESSION_SECRET }}"

          az containerapp update \
            --name "$ACA_STAGING_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$STAGING_IMAGE" \
            --min-replicas 1 \
            --max-replicas 1 \
            --cpu 0.75 --memory 1.5Gi \
            --set-env-vars \
              SESSION_SECRET=secretref:session-secret \
              MODEL_PROVIDER=mock \
              EMBEDDING_PROVIDER=local \
              PORT=8000

      - name: Resolve staging URL
        id: url
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show \
            --name "$ACA_STAGING_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "staging_url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Print staging URL
        run: |
          echo "## Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.url.outputs.staging_url }}" >> "$GITHUB_STEP_SUMMARY"

  staging-smoke:
    name: Staging smoke test
    needs: staging-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new revision to accept traffic
        # A fresh `containerapp update` doesn't guarantee the new revision
        # is already serving by the time the previous job's Azure CLI call
        # returns -- poll /health with a bounded retry budget rather than a
        # single immediate request that could flake on a slow cold start.
        run: |
          set -euo pipefail
          URL="${{ needs.staging-deploy.outputs.staging_url }}"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Staging is up after $attempt attempt(s)."
              exit 0
            fi
            echo "Attempt $attempt: /health returned $code, retrying in 5s..."
            sleep 5
          done
          echo "::error::Staging never returned 200 from /health after 20 attempts."
          exit 1

      - name: Hit /evals/latest
        run: |
          set -euo pipefail
          URL="${{ needs.staging-deploy.outputs.staging_url }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/evals/latest")
          if [ "$code" != "200" ]; then
            echo "::error::GET /evals/latest returned $code, expected 200."
            exit 1
          fi

      - name: One mock-provider recommend call
        # Mints an anonymous session (cookie-based, matching how the real
        # SPA does it) then drives one real /recipes/recommend call through
        # the full graph -- MODEL_PROVIDER=mock on this deploy (see the
        # staging-deploy job above) guarantees this costs nothing and calls
        # no real provider, while still proving the whole request path
        # (session auth, rate limiter, graph execution, response schema)
        # actually works end-to-end on the freshly deployed revision.
        run: |
          set -euo pipefail
          URL="${{ needs.staging-deploy.outputs.staging_url }}"
          COOKIES="$(mktemp)"

          session_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -c "$COOKIES" -X POST "$URL/session" \
            -H "X-Requested-With: XMLHttpRequest")
          if [ "$session_code" != "204" ]; then
            echo "::error::POST /session returned $session_code, expected 204."
            exit 1
          fi

          recommend_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -b "$COOKIES" -X POST "$URL/recipes/recommend" \
            -H "Content-Type: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            -d '{"input_type": "text", "typed_ingredients": "chicken, rice, broccoli", "user_profile": {}}')
          if [ "$recommend_code" != "200" ]; then
            echo "::error::POST /recipes/recommend returned $recommend_code, expected 200."
            exit 1
          fi
          echo "Staging smoke test passed: /health, /evals/latest, /recipes/recommend all OK."

  # ---------------------------------------------------------------------
  # Everything below this line only runs for a manual workflow_dispatch on
  # the default branch. Ordinary pushes and PRs stop at the `test`/`web`/
  # `pgvector-check` jobs. Production promotion is a deliberate human
  # action (CLAUDE.md "Human gates: Public actions" — deploy pushes are
  # pulled, not automatic).
  # ---------------------------------------------------------------------

  preflight:
    name: Azure permission preflight
    needs: [test, web, pgvector-check]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fail fast if AZURE_CREDENTIALS lacks Contributor
        run: |
          set -euo pipefail
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')
          SUB_ID=$(az account show --query id -o tsv)
          echo "Checking role assignments for service principal $CLIENT_ID on subscription $SUB_ID ..."
          ROLES=$(az role assignment list \
            --assignee "$CLIENT_ID" \
            --scope "/subscriptions/$SUB_ID" \
            --query "[].roleDefinitionName" -o tsv || true)
          if ! echo "$ROLES" | grep -Eq "Contributor|Owner"; then
            echo "::error::AZURE_CREDENTIALS (clientId=$CLIENT_ID) does not have Contributor or Owner on subscription $SUB_ID."
            echo "::error::Role assignments found: ${ROLES:-none}"
            echo "::error::FIX: In the Azure Portal (or az role assignment create), grant this service"
            echo "::error::principal the 'Contributor' role at subscription scope, or at minimum on"
            echo "::error::resource group '$RESOURCE_GROUP' (create the empty RG yourself first if you"
            echo "::error::want to scope access narrowly). Re-run this workflow once granted."
            exit 1
          fi
          echo "Preflight OK — service principal has: $ROLES"

      - name: Register required resource providers (idempotent)
        run: |
          set -euo pipefail
          for ns in Microsoft.App Microsoft.ContainerRegistry Microsoft.OperationalInsights; do
            az provider register --namespace "$ns" --wait
          done

      - name: Create resource group (if absent)
        run: |
          set -euo pipefail
          az group show --name "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az group create --name "$RESOURCE_GROUP" --location "$AZURE_REGION"

      - name: Create ACR (if absent)
        run: |
          set -euo pipefail
          az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az acr create \
              --name "$ACR_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --sku Basic \
              --admin-enabled false

  build-and-push:
    name: Build and push image to ACR
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set image tag
        id: image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/macrochef-api:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${{ steps.image.outputs.image }}" -t "$ACR_NAME.azurecr.io/macrochef-api:latest" .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.image }}"
          docker push "$ACR_NAME.azurecr.io/macrochef-api:latest"

  deploy:
    name: Create/update Container Apps environment and revision
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        # ROADMAP.md Phase 5, Step 5.1: needed to run `alembic upgrade
        # head` against the prod DB below, ahead of the traffic-shifting
        # `az containerapp update` step further down. Not needed by any
        # other step in this job.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        # ROADMAP.md Phase 5, Step 5.1 acceptance criterion: migrations
        # apply before traffic shifts to the new image. This repo has no
        # infra for an ACA init-container / pre-traffic hook, and doesn't
        # need one -- `alembic upgrade head` here runs directly against the
        # prod Postgres (Neon, see docs/DEPLOY.md) using the same
        # `DATABASE_URL` secret the container itself is given below, from
        # this job's runner, over the network, the same way any other
        # Postgres client would connect. This assumes the GitHub Actions
        # runner can reach Neon directly (no VPC/private-networking
        # boundary in front of it) -- NOT verified from within this
        # sandboxed environment; if Neon's connection string ever requires
        # an IP allowlist that excludes GitHub-hosted runners, this step
        # needs a self-hosted runner or a documented allowlist entry
        # instead.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Create Container Apps environment (if absent)
        run: |
          set -euo pipefail
          az containerapp env show \
            --name "$ACA_ENV_NAME" --resource-group "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az containerapp env create \
              --name "$ACA_ENV_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$AZURE_REGION"

      - name: Create Container App (if absent)
        run: |
          set -euo pipefail
          # SPA rebuild W6 cutover: --target-port is now 8000 (uvicorn),
          # not 8501 (the old Streamlit port). Streamlit and
          # docker-entrypoint.sh are gone -- FastAPI/uvicorn is now the
          # ONLY process in the container, serving both the JSON API and
          # the built React SPA (app/spa.py) on the same public port.
          # 1.0/2.0Gi: torch + MiniLM + Chroma needs >1Gi; default
          # 0.5/1Gi crash-looped (OOM/probe-fail) on first deploy 2026-07-18
          az containerapp show \
            --name "$ACA_APP_NAME" --resource-group "$RESOURCE_GROUP" -o none 2>/dev/null || \
            az containerapp create \
              --name "$ACA_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENV_NAME" \
              --image "${{ needs.build-and-push.outputs.image }}" \
              --target-port 8000 \
              --ingress external \
              --registry-server "$ACR_NAME.azurecr.io" \
              --registry-identity system \
              --min-replicas 1 \
              --max-replicas 1 \
              --cpu 1.0 --memory 2.0Gi

      - name: SPA cutover — update ingress target port on an EXISTING app
        # `az containerapp create`'s --target-port above only takes effect
        # the FIRST time it creates the app -- it is a no-op on every
        # subsequent run for an app that already exists (the branch above
        # takes the `az containerapp show` success path and skips
        # `create` entirely). Since ca-macrochef already existed at
        # --target-port 8501 before this cutover, an explicit
        # `ingress update` is required so an EXISTING app's public ingress
        # actually gets repointed at 8000 -- without this step the
        # container would serve on 8000 internally while ACA kept
        # forwarding public traffic to 8501, which nothing is listening on
        # anymore, and the live URL would go dark.
        run: |
          set -euo pipefail
          az containerapp ingress update \
            --name "$ACA_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --target-port 8000

      - name: Update revision — image, secrets, env vars
        run: |
          set -euo pipefail
          # otel-exporter-otlp-endpoint/-headers (ROADMAP.md Phase 1, Step
          # 1.3): a human still needs to create the hosted-backend account
          # and set these two repo secrets (docs/HUMAN_INPUTS.md entry
          # H1). Unlike a plain --set-env-vars value, `az containerapp
          # secret set` REJECTS an empty value outright
          # (ContainerAppSecretInvalid: "value or keyVaultUrl and identity
          # should be provided") -- posthog-api-key only gets away with
          # being optional-by-blank-value because that GitHub secret
          # already holds a real (if placeholder) string, not because
          # Azure tolerates "" secrets in general. So wire the OTEL
          # secret/env-var pair only when the GitHub secret is actually
          # non-empty; until the human completes H1, both stay entirely
          # unset, which app.observability.tracing.init_tracing already
          # treats as disabled (see that module's no-op-when-blank
          # contract) -- so tracing simply stays off, not a broken deploy.
          SECRETS=(
            database-url="${{ secrets.DATABASE_URL }}"
            session-secret="${{ secrets.SESSION_SECRET }}"
            gemini-api-key="${{ secrets.GEMINI_API_KEY }}"
            posthog-api-key="${{ secrets.POSTHOG_API_KEY }}"
          )
          ENV_VARS=(
            DATABASE_URL=secretref:database-url
            SESSION_SECRET=secretref:session-secret
            GEMINI_API_KEY=secretref:gemini-api-key
            POSTHOG_API_KEY=secretref:posthog-api-key
            MODEL_PROVIDER=gemini
            MODEL_PROVIDER_FALLBACKS=mock
            EMBEDDING_PROVIDER=local
            PORT=8000
          )

          OTEL_ENDPOINT="${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}"
          OTEL_HEADERS="${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}"
          if [ -n "$OTEL_ENDPOINT" ]; then
            SECRETS+=(otel-exporter-otlp-endpoint="$OTEL_ENDPOINT")
            ENV_VARS+=(OTEL_EXPORTER_OTLP_ENDPOINT=secretref:otel-exporter-otlp-endpoint)
          fi
          if [ -n "$OTEL_HEADERS" ]; then
            SECRETS+=(otel-exporter-otlp-headers="$OTEL_HEADERS")
            ENV_VARS+=(OTEL_EXPORTER_OTLP_HEADERS=secretref:otel-exporter-otlp-headers)
          fi

          az containerapp secret set \
            --name "$ACA_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets "${SECRETS[@]}"

          # min-replicas=1 / max-replicas=1 is intentional, not a placeholder:
          # embedded Chroma (data/chroma) is a single-writer store. A second
          # concurrent replica (from either autoscale-up or a rolling deploy
          # with 2 revisions briefly active) risks corrupting the index. Do
          # NOT raise max-replicas above 1 without moving to an external
          # vector store first (tracked in docs/BACKLOG.md).
          # 1.0/2.0Gi: torch + MiniLM + Chroma needs >1Gi; default
          # 0.5/1Gi crash-looped (OOM/probe-fail) on first deploy 2026-07-18
          # PORT=8000: SPA cutover (W6) -- uvicorn is now the only process
          # and the only port, replacing the old Streamlit PORT=8501.
          az containerapp update \
            --name "$ACA_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build-and-push.outputs.image }}" \
            --min-replicas 1 \
            --max-replicas 1 \
            --cpu 1.0 --memory 2.0Gi \
            --set-env-vars "${ENV_VARS[@]}"

      - name: Print live URL
        run: |
          FQDN=$(az containerapp show \
            --name "$ACA_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
