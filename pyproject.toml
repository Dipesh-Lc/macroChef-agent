[project]
name = "macrochef-agent"
version = "0.1.0"
description = "A multimodal, constraint-aware meal planning agent."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-autogenerated migration files (`alembic revision --autogenerate`)
# are boilerplate we don't hand-edit for style -- see alembic/README and
# CLAUDE.md's "never hand-edit generated files" spirit (applied here to
# generated code, not just generated data).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
